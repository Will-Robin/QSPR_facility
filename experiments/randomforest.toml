experiment_name = "rf_ecfp_pcmc"
split_name = "surfactant_type_v1"
target = "pCMC"

featurizer = "ecfp"
model = "random_forest"

[featurizer_parameters]
radius = 4
n_bits = 2048
count_based = true

[parameters]
n_estimators = 100
criterion='squared_error'
min_samples_split = 2
min_samples_leaf = 1
min_weight_fraction_leaf = 0.0
max_features = 1.0
min_impurity_decrease = 0.0
bootstrap = true
oob_score = false
random_state = 42

[training]
include_validation = true
